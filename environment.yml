name: emit-ghg
channels:
  - conda-forge

dependencies:
  # Core Python
  - python=3.11

  # Required: GDAL must be installed via conda (not pip)
  - gdal=3.13.3

  # Scientific Computing (all available via conda)
  - numpy=2.5.2
  - scipy=1.18.0
  - h5py=3.16.0
  - pytest=9.1.1
  - netcdf4=1.7.4

  # Python packages via pip
  - pip:
      - spectral==0.24
      - argparse==1.1
