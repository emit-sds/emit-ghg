name: emit-ghg
channels:
  - conda-forge

dependencies:
  # Core Python
  - python>=3.11

  # Required: GDAL must be installed via conda (not pip)
  - gdal

  # Scientific Computing (all available via conda)
  - numpy
  - scipy
  - h5py
  - pytest

  # Python packages via pip
  - pip:
      - spectral  # Hyperspectral image processing

